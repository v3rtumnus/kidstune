<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Running: spinner + progress counter + HTMX poll every 2 s -->
<span th:fragment="running"
      id="resolve-progress"
      class="text-warning d-inline-flex align-items-center gap-2 ms-2"
      hx-get="/web/admin/resolved/resolve-progress"
      hx-trigger="every 2s"
      hx-target="#resolve-progress"
      hx-swap="outerHTML">
    <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
    <span th:text="'Auflösen: ' + ${progress.completed()} + ' / ' + ${progress.total()} + ' …'"></span>
</span>

<!-- Done: success or partial-failure badge, no polling -->
<span th:fragment="done"
      id="resolve-progress"
      th:class="'badge ms-2 ' + (${progress.failed() > 0} ? 'bg-warning text-dark' : 'bg-success')"
      th:text="${progress.failed() > 0}
               ? 'Fertig: ' + ${progress.completed()} + ' / ' + ${progress.total()} + ' aufgelöst, ' + ${progress.failed()} + ' fehlgeschlagen'
               : 'Fertig: ' + ${progress.completed()} + ' / ' + ${progress.total()} + ' aufgelöst'">
</span>

</body>
</html>
